<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>차체 계측 연습</title><style>body,html{margin:0;padding:0;width:100%;height:100%;background-color:#ecf0f1;display:flex;justify-content:center;align-items:center;overflow:hidden;font-family:'Malgun Gothic',sans-serif}.master-grid{display:grid;grid-template-columns:repeat(50,1fr);grid-template-rows:repeat(40,1fr);position:relative;aspect-ratio:60/40;height:100vh;visibility:hidden}.master-grid::before{content:"";position:absolute;grid-column:11/41;grid-row:4/34;background-image:url(계측.webp);background-size:100% 100%;background-repeat:no-repeat;z-index:0;pointer-events:none;width:100%;height:100%}.measure-box{position:absolute;width:20px;height:20px;background-color:#fff;border:2px solid #000;transform:translate(-50%,-50%);z-index:5;display:flex;justify-content:center;align-items:center;color:#000;font-size:11px;font-weight:900;box-sizing:content-box}.measure-box.answerable{cursor:pointer}.measure-box.answerable:hover{outline:2px solid #1e90ff}.measure-box.selected{outline:3px solid #1e90ff}.measure-box.correct{background-color:#d4f8e0;border-color:#27ae60}.measure-box.wrong{background-color:#ffe0e3;border-color:#ff4757}.mark-arrow{color:#ff4757;font-weight:900;font-size:15px;line-height:1}.mark-circle{box-sizing:border-box;width:13px;height:13px;border:3px solid #ff4757;border-radius:50%}.mark-circle.black{border-color:#000}.answer-hint{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;color:#27ae60;background:#fff;border:1px solid #27ae60;border-radius:3px;padding:0 2px;line-height:12px;white-space:nowrap;pointer-events:none}#markPicker{position:fixed;display:none;z-index:2000;background:#2f3542;border-radius:8px;padding:6px;box-shadow:0 6px 16px rgba(0,0,0,.35);gap:4px}#markPicker button{width:38px;height:38px;border:none;border-radius:6px;background:#fff;color:#ff4757;font-size:20px;font-weight:900;cursor:pointer;display:flex;justify-content:center;align-items:center}#markPicker button:hover{background:#ffeaa7}#markPicker button.clear-btn{color:#2f3542;font-size:12px;width:44px}#markPicker .picker-circle{width:16px;height:16px;border:3px solid #ff4757;border-radius:50%;box-sizing:border-box}.top-zone-engine{grid-column:11/41;grid-row:1/4;background-color:#fff;display:flex;flex-direction:column;justify-content:space-evenly;box-sizing:border-box;z-index:10;padding:0 10px}.top-row-1{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;text-align:center}.top-col-merged{grid-column:2/5;font-size:1.6rem;font-weight:900;color:#2f3542;letter-spacing:2px}.top-col-status{grid-column:5/6;font-size:.95rem;font-weight:700;border-radius:4px;padding:2px;margin-left:auto;width:80%}.status-input{color:#1e90ff;border:2px solid #1e90ff}.status-reveal{color:#e67e22;border:2px solid #e67e22}.status-checked{color:#27ae60;border:2px solid #27ae60}.top-row-2{display:flex;width:100%;justify-content:center}.top-info-table{width:100%;border-collapse:collapse;text-align:center;border:2px solid #2f3542;background-color:#fff}.top-info-table th{background-color:#f1f2f6;border:1px solid #2f3542;padding:4px;font-size:.9rem;font-weight:900;color:#2f3542;width:15%}.top-info-table td{border:1px solid #2f3542;padding:4px;font-size:.95rem;font-weight:700;color:#2f3542;width:35%}.bottom-zone-engine{grid-column:11/41;grid-row:34/41;margin:2px 0;background-color:#fff;border-radius:8px;padding:10px;box-sizing:border-box;z-index:10;display:flex;flex-direction:column;justify-content:center}.dashboard-container{display:flex;justify-content:center;gap:8px;align-items:stretch;width:100%}.wheel-card{background-color:#f1f2f6;color:#2f3542;border-radius:6px;padding:8px;flex:1}.wheel-card table{width:100%;border-collapse:collapse}.wheel-plate{background-color:#1e90ff;color:#fff;padding:2px 8px;border-radius:4px;font-size:.8rem;display:inline-block;font-weight:900}.rear-plate{background-color:#ffa502!important}.center-plate{background-color:#2ed573;color:#fff;padding:2px 8px;border-radius:4px;font-size:.8rem;display:inline-block;font-weight:900;white-space:nowrap}th{font-size:.7rem;padding-bottom:4px;border-bottom:2px solid #2f3542;color:#2f3542;text-align:center}td{padding:4px 2px;text-align:center;color:#2f3542;font-size:.8rem;font-weight:700}input{width:90%;display:block;margin:0 auto;height:25px;border:1px solid #ccc;border-radius:4px;font-size:.95rem;font-weight:900;text-align:center;box-sizing:border-box}.measure-input{color:#000!important}.measure-input[readonly]{background-color:#e0e0e0}.standard-cell{display:block;width:90%;margin:0 auto;height:25px;line-height:25px;border:1px dashed #ff4757;border-radius:4px;color:red;font-size:.95rem;font-weight:900;background:#fff5f5;box-sizing:border-box}.standard-cell.hidden-std{color:#b2bec3;border-color:#b2bec3;background:#f8f9fa}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}input[type=number]{-moz-appearance:textfield}.left-control-panel{position:fixed;left:20px;top:20px;z-index:100;display:flex;gap:8px}.btn-back{padding:12px 15px;font-size:1rem;font-weight:900;color:#fff;background-color:#8e44ad;border:2px solid #9b59b6;border-radius:8px;cursor:pointer;box-shadow:0 4px 6px rgba(0,0,0,.2)}.btn-back:hover{background-color:#9b59b6;border-color:#fff}.right-control-panel{position:fixed;right:20px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:100;width:150px}.right-control-panel button{padding:12px 10px;font-size:1rem;font-weight:900;color:#fff;background-color:#2f3542;border:2px solid #57606f;border-radius:8px;cursor:pointer;box-shadow:0 4px 6px rgba(0,0,0,.2);transition:.2s}.right-control-panel button:hover:not(:disabled){background-color:#1e90ff;border-color:#fff}.right-control-panel button:disabled{opacity:.45;cursor:not-allowed}.right-control-panel .btn-reveal{background-color:#e67e22;border-color:#f39c12}.right-control-panel .btn-check{background-color:#27ae60;border-color:#2ecc71}.right-control-panel .btn-reset{background-color:#c0392b;border-color:#e74c3c}.right-control-panel .btn-print{background-color:#ffa502;color:#1e272e;border-color:#ff9f43}.score-display{font-size:.85rem;text-align:center;background:#fff;padding:6px;border-radius:4px;border:2px solid #27ae60;font-weight:700;color:#2f3542;display:none}.guide-display{font-size:.75rem;text-align:left;background:#fff;padding:6px 8px;border-radius:4px;border:2px solid #1e90ff;font-weight:700;color:#2f3542;line-height:1.5}#page2-panel{display:none;grid-column:11/41;grid-row:1/41;background-image:url(계측치수도.webp);background-size:100% 100%;background-repeat:no-repeat;background-color:#fff;z-index:50;position:relative;overflow:hidden}.p2-measure-box{position:absolute;background-color:#fff;border:2px solid #000;transform:translate(-50%,-50%);display:flex;justify-content:center;align-items:center;color:#ff4757;font-size:14px;font-weight:900;z-index:55}.mobile-top-bar{display:none}.kb-reveal-btn{position:fixed;display:none;z-index:10002;left:50%;transform:translateX(-50%);padding:10px 22px;font-size:15px;font-weight:900;color:#fff;background:#e67e22;border:2px solid #f39c12;border-radius:22px;box-shadow:0 4px 10px rgba(0,0,0,.3);white-space:nowrap}@media print{@page{size:A4 portrait;margin:15mm}body,html{width:100%;height:100%;background:#fff;margin:0;padding:0;display:block;overflow:hidden}#markPicker,.left-control-panel,.mobile-top-bar,.right-control-panel{display:none!important}*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}.measure-box.selected{outline:0}.master-grid{width:160%!important;height:101%!important;aspect-ratio:40/40!important;position:relative!important;left:50%!important;transform:translateX(-50%)!important;visibility:visible!important;display:grid!important}}@media screen and (max-width:768px){body,html{margin:0;padding:0;width:100vw;height:100vh;overflow:hidden!important;overscroll-behavior:none;position:fixed}.left-control-panel,.right-control-panel{display:none!important}:root{--m-scale:0.65;--m-top-bar:50px}.mobile-top-bar{display:flex!important;position:fixed!important;top:0!important;left:0!important;width:100%!important;height:var(--m-top-bar);background-color:#2f3542;z-index:10001;align-items:center;padding:0 6px;gap:4px;box-sizing:border-box;overflow-x:auto}.m-btn{flex:0 0 auto;height:34px;padding:0 8px;font-size:12px;font-weight:900;color:#fff;background:#57606f;border:none;border-radius:5px}.m-btn:disabled{opacity:.45}.m-btn-back{background:#8e44ad}.m-btn-reveal{background:#e67e22}.m-btn-check{background:#27ae60}.m-btn-reset{background:#c0392b}.m-score{flex:0 0 auto;color:#2ed573;font-size:12px;font-weight:900;margin-left:4px}.master-grid{display:grid!important;visibility:visible!important;position:absolute!important;top:var(--m-top-bar)!important;left:50%;width:130vh!important;height:127vh!important;transform:translateX(-50%) scale(var(--m-scale))!important;transform-origin:top center;margin:0!important;z-index:1;overflow:hidden!important}}</style></head><body><div class="mobile-top-bar"><button class="m-btn m-btn-back" onclick="goBackToMeasure()">계측</button> <button class="m-btn m-btn-reveal" id="m-btn-reveal" onclick="revealStandards()">기준값 보기</button> <button class="m-btn m-btn-check" id="m-btn-check" onclick="checkAnswers()" disabled="disabled">정답 확인</button> <button class="m-btn m-btn-reset" onclick="resetPractice()">다시 하기</button> <button class="m-btn" onclick="switchPage(1)">1P</button> <button class="m-btn" onclick="switchPage(2)">2P</button> <span class="m-score" id="m-score"></span></div><div class="left-control-panel"><button class="btn-back" onclick="goBackToMeasure()">◀ 차체 계측</button></div><div class="right-control-panel"><div class="guide-display" id="guideDisplay"></div><button class="btn-reveal" id="btn-reveal" onclick="revealStandards()">👁 기준값 보기</button> <button class="btn-check" id="btn-check" onclick="checkAnswers()" disabled="disabled">✅ 정답 확인</button><div class="score-display" id="scoreDisplay"></div><button class="btn-reset" onclick="resetPractice()">🔄 다시 하기</button> <button onclick="switchPage(1)">1페이지</button> <button onclick="switchPage(2)">2페이지</button> <button class="btn-print" onclick="practicePrint()">🖨️ 프린트</button></div><div class="master-grid" id="gridContainer"><div class="top-zone-engine"><div class="top-row-1"><div style="grid-column:1/2"></div><div class="top-col-merged">[계측 연습]</div><div class="top-col-status status-input" id="statusDisplay">측정값 입력</div></div><div class="top-row-2"><table class="top-info-table"><tr><th>자격종목</th><td>자동차차체수리기능사</td><th>작품명</th><td>자동차차체수리작업</td></tr></table></div></div><div class="bottom-zone-engine"><div class="dashboard-container"><div id="wheelCards" style="display:flex;gap:8px;flex:1"></div></div></div><div id="page2-panel"></div></div><button type="button" id="kbRevealBtn" class="kb-reveal-btn">👁 기준값 보기</button><div id="markPicker"><button type="button" onclick='setMark("←")'>←</button> <button type="button" onclick='setMark("→")'>→</button> <button type="button" onclick='setMark("↑")'>↑</button> <button type="button" onclick='setMark("↓")'>↓</button> <button type="button" onclick='setMark("○")'><span class="picker-circle"></span></button> <button type="button" class="clear-btn" onclick='setMark("")'>지우기</button></div><script src="계측연습.js"></script></body></html>
