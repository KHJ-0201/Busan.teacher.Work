-space:nowrap;flex:0 0 auto}.student-all-cal-side .cal-status{display:inline;font-size:10px;margin-top:0;line-height:1;max-width:100%;overflow:hidden;white-space:nowrap;flex:0 0 auto}.student-all-history-side{min-width:0}.student-all-history-title{margin:0 0 4px;padding:0 0 3px;font-size:13px;color:#0f172a;border-bottom:2px solid #94a3b8}.student-all-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #94a3b8;table-layout:fixed}.student-all-table th{background:#f1f5f9;color:#334155;font-size:11px;font-weight:800;border:1px solid #94a3b8;padding:5px 4px;text-align:center}.student-all-table td{border:1px solid #94a3b8;padding:4px;vertical-align:top;background:#fff}.student-all-table .col-date{width:88px}.student-all-table .col-name{width:72px}.student-all-table .col-content{width:auto}.student-all-table .col-action{width:auto}.student-all-table .form-control{width:100%;min-height:48px;font-size:11px;line-height:1.4;border:1px solid #cbd5e1;border-radius:4px;padding:4px;box-sizing:border-box;font-family:inherit;resize:vertical}.student-all-table input.form-control{min-height:0;height:28px;font-size:11px}.student-all-row-tools{display:flex;flex-direction:column;gap:3px;align-items:stretch;margin-top:3px}.student-all-badge{font-size:10px;font-weight:800;padding:2px 6px;border-radius:999px}.student-all-badge.done{background:#dcfce7;color:#166534}.student-all-badge.pending{background:#ffedd5;color:#c2410c}.student-all-badge.skip{background:#e2e8f0;color:#64748b}@media (max-width:1100px){.student-all-unit-block{grid-template-columns:minmax(260px,38%) minmax(0,1fr)}}@media (max-width:900px){.student-all-unit-block{grid-template-columns:1fr}.student-all-cal-side{position:static;width:100%;max-width:420px}}</style></head><body style="padding-top:80px"><style>#globalMainHarness{flex-wrap:nowrap!important}#navButtonBank{flex-wrap:nowrap!important}.nav-btn-global{color:#fff;border:none;border-radius:6px;text-align:center;box-sizing:border-box;transition:.3s -btn-global" style="background:#2c3e50" onclick='location.href=classNavHref("평가계획서.html")'>📄 계획서류</button> <button class="nav-btn-global" style="background:#16a085" onclick='location.href=classNavHref("../평가지/평가지.html")'>📋 내부평가</button> <button class="nav-btn-global" style="background:#d35400" onclick='location.href=classNavHref("상담일지.html")'>🤝 상담/이력서</button></div><div id="harnessRightBank" style="flex-shrink:0"><div style="background:#000;color:#f1c40f;padding:8px 22px;border-radius:6px;border:2px solid #f1c40f;font-weight:900;font-size:16px;box-shadow:0 0 12px rgba(241,196,15,.8);white-space:nowrap;letter-spacing:1px"><span style="color:#fff;font-size:14px;margin-right:5px">▶ 현재 학급:</span> <span id="currentClassDisplay" style="font-size:19px;text-shadow:0 0 5px #f1c40f">로딩 중...</span></div></div></div><div class="container"><div class="header"><h2 style="margin:0;color:#1e293b;font-size:22px">🤝 학생별 상담일지</h2><div class="header-btns"><a href="#" id="btnGoStudentResume" class="btn-nav" style="border-color:#16a085;color:#16a085">📄 학생 이력서 확인</a> <a href="#" id="btnGoPostCompletion" class="btn-nav" style="border-color:#8e44ad;color:#8e44ad">🎓 수료 후 상담</a></div></div><div class="log-layout"><div class="left-panel"><div class="student-list" id="studentList"><div style="padding:20px;text-align:center;color:#94a3b8;font-size:12px">데이터를 불러오는 중입니다...</div></div><div class="summary-panel" id="summaryPanel" style="display:none"><h3 style="margin-top:0;border-bottom:2px solid #f1f5f9;padding-bottom:10px;color:#0f172a;font-size:15px">📊 단위개월 상담일 중복 횟수</h3><div id="summaryCalendarArea" style="border:1px solid #e1e8ed;border-radius:8px;padding:10px;background:#f8fafc;margin-top:5px"></div></div></div><div class="right-panel"><div class="tab-menu" id="tabMenu"></div><div class="dashboard-panel" id="dashboardPanel" style="display:none"></div><div class="form-panel" id="formPanel" style="display:none"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10p
